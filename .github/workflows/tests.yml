name: Souta Recorder Windows Ubuntu tests
on:
  push:
    branches: [souta-data-collection]
  workflow_dispatch:
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PortAudio for Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 python3-tk
      - name: Install Python libraries
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q recorder_gui.py recorder_store.py export_dataset.py export_zip.py test_dataset.py
      - name: Test WAV and ZIP data logic
        run: python -m unittest discover -p "test_*.py" -v
