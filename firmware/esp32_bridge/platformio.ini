[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

upload_speed = 921600
monitor_speed = 115200

build_flags =
    -D CORE_DEBUG_LEVEL=0
    -O2


; Opt-in bench firmware for a SINGLE ESP32 serving both motor and kettle.
; Default esp32dev above remains the currently deployed motor bridge.
[env:esp32dev_kettle]
extends = env:esp32dev
lib_deps =
    crankyoldgit/IRremoteESP8266@2.8.6
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -O2
    -D ENABLE_KETTLE_BRIDGE=1
