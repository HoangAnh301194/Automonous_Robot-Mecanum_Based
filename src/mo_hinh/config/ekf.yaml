### ekf.yaml ###
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # ODOM CONFIG
    odom0: /odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,  # Fuse Vx, Vy (Linear Velocity)
                   false, false, true,   # Fuse Vyaw (Angular Velocity)
                   false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false

    # IMU CONFIG
    imu0: /imu/data
    imu0_config: [false, false, false,
              false, false, false,
              false, false, false,
              false, false, false,
              false, false, false] 
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true
    
    publish_tf: true